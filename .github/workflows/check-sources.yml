name: Monthly source freshness check

on:
  schedule:
    - cron: "17 6 1 * *" # 1st of each month, 06:17 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Check source URLs and checkedAt freshness
        id: check
        run: |
          set +e
          bun scripts/verify-sources.ts > report.md
          echo "failed=$?" >> "$GITHUB_OUTPUT"
          cat report.md
      - name: Open issue when sources are dead or stale
        if: steps.check.outputs.failed != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const title = `Source check: dead or stale sources (${new Date().toISOString().slice(0, 10)})`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['data-quality'],
            });
