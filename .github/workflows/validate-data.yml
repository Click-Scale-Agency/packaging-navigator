name: Validate country data

on:
  # Run on every PR so the required "validate" check always reports (data-only
  # path filters previously left non-data PRs blocked with a missing check).
  pull_request:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/validate-data.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validator deps
        run: npm install --no-save --no-package-lock ajv ajv-formats
      - name: Validate data against schema + project rules
        run: node scripts/validate-data.mjs
